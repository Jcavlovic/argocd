# manifests/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: argocd-nginx
  labels:
    app: nginx
  annnotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: nginx